name: Build Admin images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: admin-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${{ vars.ADMIN_NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.ADMIN_NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.ADMIN_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            ADMIN_R2_ACCOUNT_ID=${{ vars.ADMIN_R2_ACCOUNT_ID }}
            ADMIN_R2_BUCKET_NAME=${{ vars.ADMIN_R2_BUCKET_NAME }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-admin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/portfolio-admin:main
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: migrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/portfolio-admin-migrator:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
